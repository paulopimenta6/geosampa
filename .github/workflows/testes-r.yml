name: testes-r

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      executar_rede:
        description: Executar integrações com serviços públicos
        required: false
        type: boolean
        default: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Parse
        run: >-
          Rscript -e
          'f <- c(list.files("R", pattern="[.]R$", full.names=TRUE),
          list.files("tests", pattern="[.]R$", full.names=TRUE, recursive=TRUE),
          list.files("scripts", pattern="[.]R$", full.names=TRUE));
          invisible(lapply(f, function(x) parse(file=x)))'
      - name: Testes offline
        run: Rscript tests/testthat.R
      - name: Integrações reais
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.executar_rede }}
        env:
          GEOSAMPA_RUN_NETWORK_TESTS: "true"
        run: >-
          Rscript -e
          'testthat::test_dir("tests/testthat", filter="integracao-rede",
          stop_on_failure=TRUE)'
